# KVM keyboard emulation port support (StarTech SV231DPDDUA2).
# The KVM only parses a plain boot keyboard, so keyboard reports go on their
# own report-ID-free HID interface (HID_0) and media keys on HID_1.
# Needs the tommoa/zmk usb-hid-device-indexes branch (see west.yml).
CONFIG_ZMK_USB_BOOT=y
CONFIG_USB_HID_BOOT_PROTOCOL=y
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=6
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_USB_KEYBOARD_HID_DEVICE_INDEX=0
CONFIG_ZMK_USB_CONSUMER_HID_DEVICE_INDEX=1

# No extra USB interfaces, they can confuse KVM emulation ports.
CONFIG_USB_CDC_ACM=n

# Zephyr 4.1 needs these for ZMK's behavior syscalls and deprecation warnings.
CONFIG_APPLICATION_DEFINED_SYSCALL=y
CONFIG_WARN_DEPRECATED=n
